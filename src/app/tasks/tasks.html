<div style="padding: 20px;">
    <p>Today: {{today | date:'fullDate'}}</p>
    <input [(ngModel)]="taskName" placeholder="Enter a task"/>
    <button [disabled]="!taskName.trim()" (click)="onAddTask()">Add Task</button>

    <p *ngIf="task.tasks.length==0">No tasks yet-add one above!</p>


    <ul>
        <li *ngFor="let t of task.tasks; let i = index">{{t | titlecase}}
            <button (click)="task.removeTask(i)">Remove</button>
        </li>
    </ul>
</div>
