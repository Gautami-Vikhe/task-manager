<app-header></app-header>
<div style="padding: 20px;">
    <input [(ngModel)]="taskName" placeholder="Enter a task"/>
    <button [disabled]="!taskName.trim()" (click)="addTask()">Add Task</button>


    <ul>
        <li *ngFor="let task of tasks; let i = index">{{task}}
            <button (click)="removeTask(i)">Remove</button>
        </li>
    </ul>
</div>
